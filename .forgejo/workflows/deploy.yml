name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: macc-deploy

jobs:
  deploy:
    if: startsWith(github.server_url, 'http://10.69.0.10') || startsWith(github.server_url, 'https://git.sccl.cc')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build
        run: cargo build --release

      - name: Install docker CLI
        run: apt-get update && apt-get install -y docker.io

      - name: Build and push image
        run: |
          docker build -t 10.69.0.17:5000/scclie/macc:main .
          docker push 10.69.0.17:5000/scclie/macc:main

      - name: Restart container
        run: docker rm -f macc || true